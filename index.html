<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <!-- Cấu hình icon và chế độ Web App cho iPhone -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Web Ảnh">
  <link rel="apple-touch-icon" href="icon.png">
  
  <!-- Cấu hình chuẩn PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#121212">
  
  <title>Trưng Bày Ảnh</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background-color: #121212;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      padding-top: max(20px, env(safe-area-inset-top));
    }
    h1 {
      font-size: 20px;
      margin-bottom: 20px;
      font-weight: 600;
      color: #f0f0f0;
    }
    .image-container {
      width: 100%;
      max-width: 480px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      background: #1e1e1e;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .image-container img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }
  </style>
</head>
<body>

  <h1>Hình Ảnh Của Bạn</h1>

  <div class="image-container">
    <!-- Đặt tên ảnh của bạn là anh-cua-toi.jpg cùng thư mục -->
    <img src="anh-cua-toi.jpg" alt="Ảnh hiển thị" id="myImage">
  </div>

</body>
</html>
